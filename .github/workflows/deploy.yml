# Builds the static export and publishes it to GitHub Pages.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions". No branch or gh-pages branch is needed.
#
# When the custom domain goes live, delete the AWCS_BASE_PATH line below (the
# site then serves from the root instead of /awcs-website) and add the domain
# under Settings → Pages → Custom domain.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          AWCS_BASE_PATH: /awcs-website
          NEXT_PUBLIC_SITE_URL: https://abiding-way-cottage-school.github.io/awcs-website
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
